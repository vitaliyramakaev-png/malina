<!DOCTYPE html>
<html lang="ru" data-palette="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#16070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Малина — поём хором</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Unbounded:wght@700&display=swap" rel="stylesheet">
<style>
  :root{ --fs:18px; }
  /* ПАЛИТРЫ: поменяйте data-palette в теге <html> на night или mint */
  html[data-palette="night"]{ --bg:#120a10; --card:#1f1219; --line:#36202b; --text:#fff3f6; --muted:#c99bb0; --accent:#e8336d; --accent2:#ff8fb1; }
  html[data-palette="mint"]{ --bg:#0e1916; --card:#16251f; --line:#25392f; --text:#f3fbf7; --muted:#9cc4b3; --accent:#ff4f7b; --accent2:#7fe0c0; }
  html.light{ --bg:#fff5f1; --card:#ffffff; --line:#f2d9d3; --text:#3a1020; --muted:#8c5d6b; --accent:#c2185b; --accent2:#c2185b; }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif}
  .wrap{max-width:680px;margin:0 auto;padding:20px 16px 60px}
  header{text-align:center;padding:18px 0 8px}
  .brand{font-size:13px;letter-spacing:.25em;text-transform:uppercase;color:var(--accent2)}
  h1{font-family:Unbounded,Manrope,sans-serif;font-size:38px;line-height:1.05;margin:8px 0;font-weight:700}
  h1 span{color:var(--accent)}
  .sub{color:var(--muted);font-size:14px}
  .bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;border-bottom:1px solid var(--line)}
  .bar input{flex:1 1 100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:16px}
  .bar button{flex:1;padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
  .bar button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  h2{margin:30px 0 10px;font-size:15px;text-transform:uppercase;letter-spacing:.14em;color:var(--accent2);display:flex;align-items:baseline;gap:10px}
  h2 small{color:var(--muted);font-weight:400;font-size:14px}
  .song{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:8px 0;overflow:hidden}
  .song summary{list-style:none;display:flex;gap:12px;align-items:center;padding:14px;cursor:pointer}
  .song summary::-webkit-details-marker{display:none}
  .song[open]{border-color:var(--accent)}
  .num{min-width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:600;font-size:14px}
  .t{font-weight:600;font-size:17px;line-height:1.2}
  .a{color:var(--muted);font-size:14px;margin-top:2px}
  .lyrics{padding:0 16px 20px 16px;border-top:1px solid var(--line);padding-top:14px;font-size:var(--fs);line-height:1.55;white-space:pre-line}
  .lyrics .ch{display:block;border-left:3px solid var(--accent);padding-left:10px;margin:8px 0;font-weight:600}
  .lyrics .lab{display:block;color:var(--accent2);font-size:.75em;text-transform:uppercase;letter-spacing:.1em;margin:16px 0 4px}
  .lyrics .lab:first-child{margin-top:0}
  .empty{color:var(--muted);font-style:italic}
  .none{text-align:center;color:var(--muted);padding:30px 0;display:none}
  footer.invite{text-align:left}
  footer a{color:var(--accent2)}
  .qr{width:150px;height:150px;background:#fff;border-radius:14px;padding:8px;margin:12px auto}
  .qr svg{width:100%;height:100%}
  .invite{position:relative;margin-top:50px;min-height:440px;display:flex;align-items:flex-end;color:#fff;

<script>
/* ================== ПЕСНИ ==================
   Порядок песен на сайте задаётся здесь. Тексты берутся из файла songs.txt
   (лежит рядом): песня начинается со строки, где написано ровно её название.
   Строки «Припев», «Куплет 1», «Бридж», «Соло», «Проигрыш» — подписи частей.
============================================ */
const BLOCKS = [
  { title: "1-й блок", songs: [
    { artist: "Аида Ведищева", title: "Песенка о медведях" },
    { artist: "Андрей Миронов", title: "Остров невезения" },
    { artist: "Стрыкало", title: "Яхта, парус" },
    { artist: "Маша и Медведи", title: "Любочка" },
    { artist: "Animal ДжаZ", title: "Три полоски" },
    { artist: "Сергей Лазарев", title: "В самое сердце" },
    { artist: "МакSим", title: "Знаешь ли ты" },
    { artist: "Агата Кристи", title: "Как на войне" },
    { artist: "Звери", title: "Районы, кварталы" },
    { artist: "Жуки", title: "Батарейка" },
    { artist: "Ленинград", title: "Лабутены" },
  ]},
  { title: "2-й блок", songs: [
    { artist: "Градусы", title: "Режиссёр" },
    { artist: "Ирина Аллегрова", title: "Угонщица" },
    { artist: "Винтаж", title: "Ева" },
    { artist: "Надежда Кадышева", title: "Веночек" },
    { artist: "Филипп Киркоров", title: "Я эту жизнь тебе отдам" },
    { artist: "Лолита", title: "На Титанике" },
    { artist: "Михаил Круг", title: "Владимирский централ" },
    { artist: "Трофим", title: "Город Сочи" },
    { artist: "Смысловые галлюцинации", title: "Вечно молодой" },
    { artist: "Ленинград", title: "В Питере — пить" },
    { artist: "", title: "Марджанджа" },
    { artist: "Крис Кельми", title: "Замыкая круг" },
  ]},
];

/* ================== ЛОГИКА ================== */
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function render(text){
  if(!text.trim()) return '<span class="empty">Текст скоро появится</span>';
  let out = [], inCh = false, buf = [];
  const flush = () => { if(buf.length){ out.push(inCh ? `<span class="ch">${buf.join('\n')}</span>` : buf.join('\n')); buf = []; } };
  for (const raw of text.trim().split('\n')){
    let line = esc(raw.trim()); const br = line.match(/^\[(.{2,20})\]$/); if (br) line = br[1] + ':';
    if(!line){ flush(); inCh = false; out.push(''); continue; }
    if(/^припев/i.test(line) && line.length < 25){ flush(); inCh = true; out.push(`<span class="lab">${line.replace(/:$/,'')}</span>`); continue; }
    if((/:$/.test(line) && line.length < 30) || /^(куплет|бридж|соло|проигрыш|вступление|кода|финал)[\s\d.:]*$/i.test(line)){ flush(); inCh = false; out.push(`<span class="lab">${line.replace(/:$/,'')}</span>`); continue; }
    buf.push(line);
  }
  flush();
  return out.join('\n').replace(/\n{3,}/g,'\n\n').replace(/\n+(<span class="(?:lab|ch)")/g,'$1').replace(/<\/span>\n+/g,'</span>');
}
const norm = s => s.toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9]+/g,'');
const list = document.getElementById('list');
let n = 0;
list.innerHTML = BLOCKS.map(b => `
  <section class="block"><h2>${b.title}</h2>
  ${b.songs.map(s => `
    <details class="song" data-s="${(s.artist+' '+s.title).toLowerCase()}" data-k="${norm(s.title)}">
      <summary><div class="num">${++n}</div><div><div class="t">${s.title}</div>${s.artist?`<div class="a">${s.artist}</div>`:''}</div></summary>
      <div class="lyrics">${render('')}</div>
    </details>`).join('')}
  </section>`).join('');

function parseSongs(txt){
  const keys = new Set(BLOCKS.flatMap(b => b.songs.map(s => norm(s.title))));
  const artists = {}; BLOCKS.forEach(b => b.songs.forEach(s => artists[norm(s.title)] = norm(s.artist)));
  const out = {}; let cur = null, prevBlank = true;
  for (const line of txt.replace(/\r/g,'').split('\n')){
    const k = norm(line), blank = !line.trim();
    if (k && keys.has(k) && !(k in out) && prevBlank && line.trim().length < 60){ cur = k; out[cur] = []; prevBlank = false; continue; }
    prevBlank = blank;
    if (cur){ if (!out[cur].some(l => l.trim()) && artists[cur] && k === artists[cur]) continue; out[cur].push(line); }
  }
  return out;
}
fetch('songs.txt').then(r => r.ok ? r.text() : '').then(txt => {
  const texts = parseSongs(txt);
  document.querySelectorAll('.song').forEach(el => {
    const t = texts[el.dataset.k];
    if (t) el.querySelector('.lyrics').innerHTML = render(t.join('\n'));
  });
}).catch(() => {});
const store = { get(k){ try{return localStorage.getItem(k)}catch(e){return null} }, set(k,v){ try{localStorage.setItem(k,v)}catch(e){} } };
const $ = id => document.getElementById(id);
const songs = [...document.querySelectorAll('.song')];

$('q').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase(); let shown = 0;
  document.querySelectorAll('.block').forEach(b => {
    let vis = 0;
    b.querySelectorAll('.song').forEach(s => { const ok = !q || s.dataset.s.includes(q); s.style.display = ok ? '' : 'none'; if(ok) vis++; });
    b.style.display = vis ? '' : 'none'; shown += vis;
  });
  $('none').style.display = shown ? 'none' : 'block';
});
$('all').onclick = () => songs.forEach(s => s.open = true);
$('fold').onclick = () => songs.forEach(s => s.open = false);

let fs = +(store.get('fs') || 17);
const setFs = v => { fs = Math.max(13, Math.min(30, v)); document.documentElement.style.setProperty('--fs', fs+'px'); store.set('fs', fs); };
setFs(fs);
$('minus').onclick = () => setFs(fs - 2);
$('plus').onclick = () => setFs(fs + 2);

const setTheme = light => { document.documentElement.classList.toggle('light', light); $('theme').textContent = light ? '🌙 Тёмный' : '☀️ Светлый'; store.set('light', light ? '1' : ''); };
setTheme(!!store.get('light'));
$('theme').onclick = () => setTheme(!document.documentElement.classList.contains('light'));

</script>
